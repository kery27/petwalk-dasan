<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>산책 다이어리</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="산책다이어리">
<meta name="theme-color" content="#f7ede2">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  /* [오늘] — 첫 화면(2026-11-14, 화면 구조 C안: hq DECISIONS.md 11/13, SPEC_STAGE0.md 4절).
     지도가 없다. 앱을 열어도 위치를 읽지 않고, 지도 타일도 받지 않는다 — 그래서 바로 뜨고,
     남에게 화면을 보여 줘도 집 근처가 드러나지 않는다.
     지도는 [동네](town.html), 산책 기록은 산책 화면(walk.html — 예전 index.html)에 있다.
     여기서는 이 기기에 저장된 산책 기록(petwalk_walks)을 읽어 오늘과 이번 주를 보여 주기만 한다.
     "오늘 충분해요 ✓" 같은 목표 대비 한 줄은 목표 숫자가 정해지면 넣는다(기획표 V1-01·V1-02, 아직 미정). */
  :root {
    --bg: #f7ede2; --panel: #fffaf3; --panel-border: #e6d6c1;
    --ink: #4a3f35; --ink-soft: #6b5d4e; --accent: #b8563a; --accent-tint: #f3ddd2;
    --shadow-rgb: 74, 63, 53;
    --sig-green: #3f9b5b; --sig-yellow: #dfa21f; --sig-red: #d2493f;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; min-height: 100%; font-family: 'Pretendard', -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color: var(--ink); background: var(--bg);
  }
  body { padding: 18px 16px 32px; }
  .wrap { max-width: 420px; margin: 0 auto; }

  /* 위쪽 강아지 얼굴 — 누르면 프로필(C안: "프로필·설정은 [오늘] 위쪽 강아지 얼굴에서") */
  .who { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--ink); margin-bottom: 18px; }
  .face {
    position: relative; flex-shrink: 0; width: 52px; height: 52px; border-radius: 50%;
    background: var(--accent-tint); color: var(--accent); overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    border: 3px solid var(--panel-border);
  }
  .face img { width: 100%; height: 100%; object-fit: cover; }
  .face img[hidden] { display: none; }
  .who-name { font-size: 20px; font-weight: 800; letter-spacing: -0.01em; }
  .who-sub { font-size: 13px; color: var(--ink-soft); margin-top: 2px; }

  .panel {
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 20px;
    padding: 20px; box-shadow: 0 4px 16px rgba(var(--shadow-rgb), 0.08); margin-bottom: 14px;
  }
  .panel h2 { font-size: 13px; font-weight: 700; color: var(--ink-soft); margin: 0 0 10px; }

  .today-num { font-size: 52px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
  .today-num small { font-size: 20px; font-weight: 700; margin-left: 4px; letter-spacing: 0; }
  .today-sub { font-size: 14px; color: var(--ink-soft); margin: 8px 0 0; }

  .btn-main {
    display: block; width: 100%; text-align: center; text-decoration: none;
    border: none; border-radius: 999px; padding: 16px; margin-top: 18px;
    background: linear-gradient(180deg, #c96b4f 0%, var(--accent) 100%); color: #fff;
    font-family: inherit; font-weight: 800; font-size: 17px; cursor: pointer;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), inset 0 -3px 6px rgba(0,0,0,0.15), 0 6px 16px rgba(var(--shadow-rgb), 0.3);
  }
  .btn-main:active { transform: scale(0.98); }
  .btn-note { font-size: 12px; color: var(--ink-soft); text-align: center; margin: 10px 0 0; line-height: 1.5; }

  /* 이번 주 막대 */
  .week { display: flex; align-items: flex-end; gap: 8px; height: 96px; }
  .week .day { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 6px; }
  .week .bar { width: 100%; max-width: 28px; border-radius: 7px 7px 3px 3px; background: var(--accent-tint); min-height: 4px; }
  .week .day.is-today .bar { background: var(--accent); }
  .week .day.is-empty .bar { background: var(--panel-border); }
  .week .lbl { font-size: 11px; font-weight: 700; color: var(--ink-soft); }
  .week .day.is-today .lbl { color: var(--accent); }
  .week-sum { font-size: 13px; color: var(--ink-soft); margin: 12px 0 0; }

  .last { display: flex; align-items: center; justify-content: space-between; gap: 10px; text-decoration: none; color: var(--ink); }
  .last strong { font-size: 15px; font-weight: 700; }
  .last span { font-size: 13px; color: var(--ink-soft); }
  .last .go { color: var(--accent); font-weight: 700; flex-shrink: 0; }

  .notice {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--accent-tint); border-radius: 14px; padding: 12px 14px; margin-bottom: 14px;
    font-size: 14px; line-height: 1.5; text-decoration: none; color: var(--ink);
  }
  .notice strong { color: var(--accent); flex-shrink: 0; }
  .notice[hidden] { display: none; }

  .links { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 18px 2px 0; }
  .links a { font-size: 13px; color: var(--ink-soft); }
  .links a[hidden] { display: none; }
</style>
</head>
<body>

<div class="wrap">
  <a class="who" href="profile.html" title="프로필 고치기">
    <span class="face" id="face">
      <svg id="face-paw" width="26" height="26" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M212,80a28,28,0,1,0,28,28A28,28,0,0,0,212,80Zm0,40a12,12,0,1,1,12-12A12,12,0,0,1,212,120ZM72,108a28,28,0,1,0-28,28A28,28,0,0,0,72,108ZM44,120a12,12,0,1,1,12-12A12,12,0,0,1,44,120ZM92,88A28,28,0,1,0,64,60,28,28,0,0,0,92,88Zm0-40A12,12,0,1,1,80,60,12,12,0,0,1,92,48Zm72,40a28,28,0,1,0-28-28A28,28,0,0,0,164,88Zm0-40a12,12,0,1,1-12,12A12,12,0,0,1,164,48Zm23.12,100.86a35.3,35.3,0,0,1-16.87-21.14,44,44,0,0,0-84.5,0A35.25,35.25,0,0,1,69,148.82,40,40,0,0,0,88,224a39.48,39.48,0,0,0,15.52-3.13,64.09,64.09,0,0,1,48.87,0,40,40,0,0,0,34.73-72ZM168,208a24,24,0,0,1-9.45-1.93,80.14,80.14,0,0,0-61.19,0,24,24,0,0,1-20.71-43.26,51.22,51.22,0,0,0,24.46-30.67,28,28,0,0,1,53.78,0,51.27,51.27,0,0,0,24.53,30.71A24,24,0,0,1,168,208Z"/></svg>
      <img id="face-img" alt="" hidden>
    </span>
    <span>
      <span class="who-name" id="who-name">우리 아이</span>
      <span class="who-sub" id="who-sub" style="display:block;"></span>
    </span>
  </a>

  <a class="notice" id="start-notice" href="start.html" hidden>
    <span>강아지를 등록하고 주민증 카드를 만들어 보세요.</span><strong>만들기</strong>
  </a>

  <section class="panel">
    <h2 id="today-label">오늘</h2>
    <div class="today-num"><span id="today-min">0</span><small>분</small></div>
    <p class="today-sub" id="today-sub">아직 오늘 산책 기록이 없어요.</p>
    <a class="btn-main" id="go-btn" href="go.html">산책 나가기</a>
    <p class="btn-note" id="go-note">시간만 재거나, 길까지 기록할 수 있어요.</p>
  </section>

  <section class="panel">
    <h2>최근 7일</h2>
    <div class="week" id="week"></div>
    <p class="week-sum" id="week-sum"></p>
  </section>

  <section class="panel" id="last-panel" hidden>
    <h2>최근 산책</h2>
    <a class="last" href="walk-history.html">
      <span><strong id="last-title"></strong><br><span id="last-sub"></span></span>
      <span class="go">기록 보기</span>
    </a>
  </section>

  <div class="links">
    <a href="start.html">주민증 카드</a>
    <a href="privacy.html">개인정보 안내</a>
    <a href="#" id="install-link" hidden>홈 화면에 추가</a>
  </div>
</div>

<script src="tabbar.js?v=1" data-tab="today"></script>
<script>
(function () {
  var WALKS_KEY = 'petwalk_walks';     // walk.html이 산책을 끝낼 때 저장하는 기록
  var PROFILE_KEY = 'petwalk_profile';
  var SIGNALS = {
    green:  { label: '초록불 · 다가와도 좋아요', color: '#3f9b5b' },
    yellow: { label: '노랑불 · 천천히 인사해요', color: '#dfa21f' },
    red:    { label: '빨강불 · 눈으로만 예뻐해 주세요', color: '#d2493f' }
  };
  var DAY_NAMES = ['일', '월', '화', '수', '목', '금', '토'];

  function loadJSON(key, fallback) {
    try { return JSON.parse(localStorage.getItem(key)) || fallback; } catch (e) { return fallback; }
  }
  function pad2(n) { return n < 10 ? '0' + n : '' + n; }
  // walk.html의 dateKey와 같은 형식(YYYY-MM-DD, 기기 시간 기준)
  function dateKey(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }

  // ── 강아지 ──
  var profile = loadJSON(PROFILE_KEY, {});
  if (profile.name) document.getElementById('who-name').textContent = profile.name;
  if (profile.photo) {
    var img = document.getElementById('face-img');
    img.src = profile.photo;
    img.hidden = false;
    document.getElementById('face-paw').style.display = 'none';
  }
  var sig = SIGNALS[profile.signal];
  var whoSub = document.getElementById('who-sub');
  if (sig) {
    whoSub.textContent = sig.label;
    document.getElementById('face').style.borderColor = sig.color;
  } else {
    whoSub.textContent = profile.name ? '프로필 고치기' : '프로필을 등록해 주세요';
  }
  document.getElementById('start-notice').hidden = !!(profile.name && sig);

  // ── 오늘 ──
  var walks = loadJSON(WALKS_KEY, []);
  var now = new Date();
  var todayKey = dateKey(now);
  document.getElementById('today-label').textContent =
    '오늘 · ' + (now.getMonth() + 1) + '월 ' + now.getDate() + '일 ' + DAY_NAMES[now.getDay()] + '요일';

  // 날짜별 합계 — 5분·200m 미만 산책도 시간에는 넣는다(보상 횟수에서만 빠진다)
  var byDate = {};
  walks.forEach(function (w) {
    if (!w || !w.date) return;
    var d = byDate[w.date] || (byDate[w.date] = { min: 0, km: 0, count: 0 });
    d.min += w.durationMin || 0;
    d.km += w.distanceKm || 0;
    d.count += 1;
  });

  var today = byDate[todayKey];
  if (today) {
    document.getElementById('today-min').textContent = today.min;
    document.getElementById('today-sub').textContent = '산책 ' + today.count + '번' + (today.km ? ' · ' + today.km.toFixed(1) + 'km' : '');
  }

  // 끝 화면(walk-end.html)에서 답한 것이 있으면 오늘 줄에 덧붙인다
  var FEEL = { enough: '충분했어요', short: '조금 아쉬워요' };
  var lastToday = null;
  walks.forEach(function (w) { if (w && w.date === todayKey) lastToday = w; });
  if (today && lastToday) {
    var extra = [];
    if (FEEL[lastToday.feel]) extra.push(FEEL[lastToday.feel]);
    if (lastToday.sniff) extra.push('킁킁 ' + lastToday.sniff);
    if (extra.length) document.getElementById('today-sub').textContent += ' · ' + extra.join(' · ');
  }

  // 시간만 재는 산책(go.html)이 진행 중이면 버튼이 그 화면으로 돌아가게 한다
  var active = loadJSON('petwalk_active_walk', null);
  if (active && active.startedAt) {
    var goMin = Math.max(0, Math.floor((Date.now() - active.startedAt) / 60000));
    document.getElementById('go-btn').textContent = '산책 중 · ' + goMin + '분째';
    document.getElementById('go-note').textContent = '눌러서 산책 화면으로 돌아가 끝내기를 눌러 주세요.';
  }

  // ── 최근 7일 막대(오늘이 맨 오른쪽) ──
  var weekEl = document.getElementById('week');
  var days = [];
  for (var i = 6; i >= 0; i--) {
    var d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);
    var rec = byDate[dateKey(d)];
    days.push({ label: DAY_NAMES[d.getDay()], min: rec ? rec.min : 0, isToday: i === 0 });
  }
  var maxMin = Math.max.apply(null, days.map(function (x) { return x.min; }).concat([30]));
  var weekTotal = 0, weekDays = 0;
  days.forEach(function (x) {
    weekTotal += x.min;
    if (x.min > 0) weekDays += 1;
    var col = document.createElement('div');
    col.className = 'day' + (x.isToday ? ' is-today' : '') + (x.min ? '' : ' is-empty');
    col.title = x.label + '요일 ' + x.min + '분';
    var bar = document.createElement('div');
    bar.className = 'bar';
    bar.style.height = x.min ? Math.max(8, Math.round(x.min / maxMin * 100)) + '%' : '4px';
    var lbl = document.createElement('div');
    lbl.className = 'lbl';
    lbl.textContent = x.isToday ? '오늘' : x.label;
    col.appendChild(bar);
    col.appendChild(lbl);
    weekEl.appendChild(col);
  });
  document.getElementById('week-sum').textContent = weekDays
    ? '7일 중 ' + weekDays + '일 산책 · 모두 ' + weekTotal + '분'
    : '최근 7일 동안 기록이 없어요.';

  // ── 최근 산책 ──
  var last = walks.length ? walks[walks.length - 1] : null;
  if (last && last.date) {
    var parts = last.date.split('-');
    document.getElementById('last-title').textContent =
      (last.date === todayKey ? '오늘' : Number(parts[1]) + '월 ' + Number(parts[2]) + '일') + ' 산책';
    document.getElementById('last-sub').textContent =
      (last.durationMin || 0) + '분' + (last.distanceKm ? ' · ' + last.distanceKm.toFixed(1) + 'km' : ' · 시간만 기록');
    document.getElementById('last-panel').hidden = false;
  }

  // ── 홈 화면에 추가(설치) — 브라우저가 설치 가능하다고 알려 줄 때만 링크를 보인다 ──
  var installLink = document.getElementById('install-link');
  var deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferredPrompt = e;
    installLink.hidden = false;
  });
  installLink.addEventListener('click', function (e) {
    e.preventDefault();
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    deferredPrompt = null;
    installLink.hidden = true;
  });
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () { /* 설치 지원이 안 될 뿐 화면은 그대로 */ });
  }
})();
</script>

</body>
</html>
