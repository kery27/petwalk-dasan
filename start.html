<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>댕댕이 주민증 만들기</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=2">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
<meta name="theme-color" content="#f7ede2">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  /* 공원 현장용 30초 흐름(2026-11-14, 기획표 V0-19): QR → 신호등 고르기 → 이름·사진 → 주민증 카드 저장.
     공원에서 처음 만난 견주에게 30초 안에 "내 강아지 카드"를 쥐여 주는 화면이다.
     서버 없음 — 이름·사진·신호등은 이 기기 localStorage(petwalk_profile)에만 저장되고 밖으로 나가지 않는다.
     위치 권한도 묻지 않는다. 신호등 값은 profile.html에서도 바꿀 수 있다. */
  :root {
    /* index.html/profile.html과 동일한 색 토큰 */
    --bg: #f7ede2; --panel: #fffaf3; --panel-border: #e6d6c1;
    --ink: #4a3f35; --ink-soft: #6b5d4e; --accent: #b8563a; --accent-tint: #f3ddd2;
    --shadow-rgb: 74, 63, 53;
    --sig-green: #3f9b5b; --sig-yellow: #dfa21f; --sig-red: #d2493f;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; min-height: 100%; font-family: 'Pretendard', -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color: var(--ink); background: var(--bg);
  }
  body { padding: 20px 16px 36px; }
  .wrap { max-width: 420px; margin: 0 auto; }

  .steps { display: flex; gap: 6px; margin-bottom: 18px; }
  .steps span { flex: 1; height: 4px; border-radius: 2px; background: var(--panel-border); }
  .steps span.is-on { background: var(--accent); }

  h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.3; margin: 0 0 6px; }
  .lead { font-size: 14px; line-height: 1.6; color: var(--ink-soft); margin: 0 0 20px; }

  .step[hidden] { display: none; }

  /* 1단계: 신호등 */
  .signal-list { display: flex; flex-direction: column; gap: 10px; }
  .signal-btn {
    display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
    background: var(--panel); border: 2px solid var(--panel-border); border-radius: 18px;
    padding: 16px; font-family: inherit; color: var(--ink); cursor: pointer;
    box-shadow: 0 2px 8px rgba(var(--shadow-rgb), 0.08);
  }
  .signal-btn:active { transform: scale(0.99); }
  .signal-btn .lamp { flex-shrink: 0; width: 38px; height: 38px; border-radius: 50%; }
  .signal-btn strong { display: block; font-size: 17px; font-weight: 800; margin-bottom: 2px; }
  .signal-btn span.desc { font-size: 13px; color: var(--ink-soft); line-height: 1.45; }
  .signal-btn[data-signal="green"] .lamp { background: var(--sig-green); }
  .signal-btn[data-signal="yellow"] .lamp { background: var(--sig-yellow); }
  .signal-btn[data-signal="red"] .lamp { background: var(--sig-red); }

  /* 2단계: 이름·사진 */
  .panel {
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 18px;
    padding: 22px 20px; box-shadow: 0 4px 16px rgba(var(--shadow-rgb), 0.1);
  }
  .photo-picker { display: flex; justify-content: center; margin-bottom: 20px; }
  .photo-btn {
    /* 카드의 사진 칸(460×520)과 같은 비율 — 여기서 보이는 대로 카드에 들어간다 */
    position: relative; width: 124px; height: 140px; border-radius: 22px;
    background: var(--accent-tint); border: 2px dashed var(--panel-border);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    cursor: pointer; overflow: hidden; padding: 0; font-family: inherit; color: var(--accent);
    font-size: 13px; font-weight: 700;
  }
  .photo-btn img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .photo-btn img[hidden] { display: none; }
  .photo-btn .plus { font-size: 30px; line-height: 1; }
  #photo-input { display: none; }
  .field label { display: block; font-size: 12px; font-weight: 700; color: var(--ink-soft); margin-bottom: 6px; }
  .field input {
    width: 100%; font-family: inherit; font-size: 17px; padding: 13px 12px;
    border: 1px solid var(--panel-border); border-radius: 12px; color: var(--ink); background: #fff;
  }

  .btn-main {
    width: 100%; border: none; border-radius: 999px; padding: 15px; margin-top: 16px;
    background: linear-gradient(180deg, #c96b4f 0%, var(--accent) 100%); color: #fff;
    font-family: inherit; font-weight: 700; font-size: 16px; cursor: pointer;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), inset 0 -3px 6px rgba(0,0,0,0.15), 0 6px 16px rgba(var(--shadow-rgb), 0.3);
  }
  .btn-main:active { transform: scale(0.98); }
  .btn-main[disabled] { opacity: 0.5; cursor: default; }
  .btn-sub {
    display: block; width: 100%; text-align: center; text-decoration: none;
    border: 1px solid var(--panel-border); border-radius: 999px; padding: 13px; margin-top: 10px;
    background: var(--panel); color: var(--ink); font-family: inherit; font-weight: 700; font-size: 15px; cursor: pointer;
  }
  .btn-sub[hidden] { display: none; }
  .btn-text[hidden], .foot[hidden] { display: none; }
  .btn-text {
    display: block; margin: 14px auto 0; background: none; border: none; padding: 6px 10px;
    font-family: inherit; font-size: 13px; font-weight: 600; color: var(--ink-soft); text-decoration: underline; cursor: pointer;
  }

  /* 3단계: 카드 */
  .card-img {
    /* 스토리용(세로로 긴 그림)을 골라도 저장 버튼이 화면 밖으로 밀리지 않게 높이를 묶는다 */
    display: block; max-width: 100%; max-height: 56vh; width: auto; height: auto; margin: 0 auto; border-radius: 16px;
    box-shadow: 0 8px 24px rgba(var(--shadow-rgb), 0.22);
  }
  .format {
    display: flex; gap: 4px; padding: 4px; margin: 14px auto 0; width: max-content;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 999px;
  }
  .format button {
    border: none; background: transparent; color: var(--ink-soft); border-radius: 999px;
    padding: 8px 16px; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .format button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .format + .btn-main { margin-top: 12px; }
  .save-hint { font-size: 12px; color: var(--ink-soft); text-align: center; margin: 10px 0 0; }
  .extra { margin-top: 18px; font-size: 13px; line-height: 1.6; color: var(--ink-soft); }
  .extra[hidden] { display: none; }

  .foot { margin-top: 22px; font-size: 12px; line-height: 1.6; color: var(--ink-soft); }
  .foot a { color: var(--ink-soft); }
</style>
<!-- 왈슨 시작 화면(splash.css/js): 이번 세션에 이미 봤으면 처음부터 숨긴다 -->
<script>try { if (sessionStorage.getItem('walson_splash_shown')) document.documentElement.classList.add('no-splash'); } catch (e) {}</script>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
<link rel="stylesheet" href="splash.css?v=1">
<link rel="preload" as="image" href="icons/walson-logo.webp">
</head>
<body>
<div id="splash" role="img" aria-label="왈슨 — 댕댕이 산책 필수앱, 제작 johnsongarage">
  <div class="splash-main">
    <img src="icons/walson-logo.webp" alt="" width="900" height="732">
    <div class="splash-name">왈슨</div>
    <div class="splash-tag">댕댕이 산책 필수앱</div>
  </div>
  <div class="splash-by">제작자 johnsongarage</div>
</div>
<script src="splash.js?v=1"></script>

<div class="wrap">
  <div class="steps" aria-hidden="true"><span id="bar-1" class="is-on"></span><span id="bar-2"></span><span id="bar-3"></span></div>

  <!-- 1단계 -->
  <section class="step" id="step-1">
    <h1>우리 아이는<br>어떤 신호등인가요?</h1>
    <p class="lead">산책길에서 다른 강아지를 만났을 때를 떠올려 보세요. 나중에 바꿀 수 있어요.</p>
    <div class="signal-list">
      <button type="button" class="signal-btn" data-signal="green">
        <span class="lamp"></span>
        <span><strong>초록불</strong><span class="desc">다가와도 좋아요</span></span>
      </button>
      <button type="button" class="signal-btn" data-signal="yellow">
        <span class="lamp"></span>
        <span><strong>노랑불</strong><span class="desc">천천히 인사해요</span></span>
      </button>
      <button type="button" class="signal-btn" data-signal="red">
        <span class="lamp"></span>
        <span><strong>빨강불</strong><span class="desc">눈으로만 예뻐해 주세요</span></span>
      </button>
    </div>
  </section>

  <!-- 2단계 -->
  <section class="step" id="step-2" hidden>
    <h1>이름과 사진을<br>알려 주세요</h1>
    <p class="lead">이 휴대폰에만 저장돼요. 어디로도 보내지 않아요.</p>
    <div class="panel">
      <div class="photo-picker">
        <button type="button" class="photo-btn" id="photo-btn">
          <span class="plus">+</span><span>사진 고르기</span>
          <img id="photo-preview" alt="" hidden>
        </button>
        <input type="file" id="photo-input" accept="image/*">
      </div>
      <div class="field">
        <label for="f-name">강아지 이름</label>
        <input id="f-name" placeholder="코코" maxlength="10" autocomplete="off">
      </div>
      <button type="button" class="btn-main" id="make-btn" disabled>주민증 만들기</button>
    </div>
    <button type="button" class="btn-text" id="back-btn">신호등 다시 고르기</button>
  </section>

  <!-- 3단계 -->
  <section class="step" id="step-3" hidden>
    <h1 id="done-title">주민증이 나왔어요</h1>
    <p class="lead">저장해서 가족이나 친구에게 자랑해 보세요.</p>
    <img class="card-img" id="card-img" alt="댕댕이 주민증 카드">
    <!-- 저장 모양(2026-11-14 피드백): 가로 카드만 저장하면 인스타 스토리·카톡 프로필에서 양옆이 잘린다 -->
    <div class="format" role="group" aria-label="저장할 모양">
      <button type="button" data-format="card" aria-pressed="true">카드만</button>
      <button type="button" data-format="square" aria-pressed="false">정사각형</button>
      <button type="button" data-format="story" aria-pressed="false">스토리용</button>
    </div>
    <button type="button" class="btn-main" id="save-btn">이미지 저장</button>
    <p class="save-hint">저장이 안 되면 카드를 길게 눌러 저장하세요.</p>
    <a class="btn-sub" href="town.html">동네 지도 보러 가기</a>
    <a class="btn-sub" id="channel-link" href="#" target="_blank" rel="noopener" hidden>출시 소식 받기 (카카오톡 채널)</a>
    <p class="extra" id="keyring-note" hidden></p>
    <button type="button" class="btn-text" id="redo-btn">처음부터 다시 만들기</button>
  </section>

  <p class="foot">
    로그인 없이 이 기기에만 저장돼요. 위치는 묻지 않아요.
    <a href="privacy.html">어떤 정보를 어디에 두는지 보기</a>
  </p>
</div>

<canvas id="card-canvas" width="1600" height="1000" hidden></canvas>

<!-- 카드에 넣는 QR을 그리는 라이브러리(MIT). 이 휴대폰 안에서만 계산하고 어디로도 보내지 않는다.
     못 받아오면(오프라인 등) QR 없이 주소 글자만 들어간다. -->
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>

<script src="spots-data.js"></script>
<script src="infra-pins.js?v=6"></script>
<script>
(function () {
  var PROFILE_KEY = 'petwalk_profile'; // profile.html·my-card.html·index.html과 같이 쓴다

  // ── 운영자가 정하면 채우는 값(비어 있으면 화면에 안 보인다) ──
  // 카카오톡 채널 주소: 채널을 연 뒤 넣는다(기획표 V0-12).
  var KAKAO_CHANNEL_URL = '';
  // 키링 안내 문구: 조건·수량·받는 날이 정해지면 넣는다(기획표 V2-10). 정해지기 전에 약속하지 않는다.
  var KEYRING_NOTE = '';
  // 카드에 찍는 "나도 만들기" 주소(2026-11-14 피드백: 카드를 본 사람이 들어올 입구가 없었다).
  // 주의: 저장된 카드는 계속 돌아다니는데, 지금 주소는 GitHub 계정·저장소 이름에 묶여 있어 옮기면 깨진다.
  // 내 도메인을 연결하면(QR_RULES.md — pet.johnsongarage.co.kr, 지금은 보류) 여기 두 값을 그 주소로 바꿀 것.
  var SHARE_URL = 'https://kery27.github.io/petwalk-dasan/start.html';
  var SHARE_URL_TEXT = 'kery27.github.io/petwalk-dasan';

  var SIGNALS = {
    green:  { label: '초록불', line: '다가와도 좋아요', color: '#3f9b5b' },
    yellow: { label: '노랑불', line: '천천히 인사해요', color: '#dfa21f' },
    red:    { label: '빨강불', line: '눈으로만 예뻐해 주세요', color: '#d2493f' },
    // 신호등을 정하지 않은 가게 수호지킴이용 — 불은 켜지 않고 앱 색으로 그린다
    none:   { label: '수호지킴이', line: '가게를 지키고 있어요', color: '#b8563a' }
  };

  function loadProfile() {
    try { return JSON.parse(localStorage.getItem(PROFILE_KEY)) || {}; } catch (e) { return {}; }
  }
  function saveProfile(p) {
    try { localStorage.setItem(PROFILE_KEY, JSON.stringify(p)); return true; } catch (e) { return false; }
  }

  var profile = loadProfile();
  var signal = SIGNALS[profile.signal] ? profile.signal : null;
  var photoDataUrl = profile.photo || null;
  var photoImage = null;
  var guardianSpot = null; // 가게 수호지킴이 카드를 보는 중이면 그 가게 이름

  var steps = [1, 2, 3].map(function (n) { return document.getElementById('step-' + n); });
  var bars = [1, 2, 3].map(function (n) { return document.getElementById('bar-' + n); });
  var fName = document.getElementById('f-name');
  var makeBtn = document.getElementById('make-btn');
  var photoBtn = document.getElementById('photo-btn');
  var photoInput = document.getElementById('photo-input');
  var photoPreview = document.getElementById('photo-preview');
  var canvas = document.getElementById('card-canvas');
  var cardImg = document.getElementById('card-img');

  function showStep(n) {
    steps.forEach(function (el, i) { el.hidden = (i !== n - 1); });
    bars.forEach(function (el, i) { el.classList.toggle('is-on', i < n); });
    window.scrollTo(0, 0);
  }

  // ── 1단계 ──
  Array.prototype.forEach.call(document.querySelectorAll('.signal-btn'), function (btn) {
    btn.addEventListener('click', function () {
      signal = btn.getAttribute('data-signal');
      showStep(2);
    });
  });

  // ── 2단계 ──
  function refreshMakeBtn() { makeBtn.disabled = !fName.value.trim(); }
  fName.value = profile.name || '';
  fName.addEventListener('input', refreshMakeBtn);
  refreshMakeBtn();

  function showPhoto(dataUrl) {
    if (!dataUrl) { photoPreview.hidden = true; return; }
    photoPreview.src = dataUrl;
    photoPreview.hidden = false;
  }
  showPhoto(photoDataUrl);

  // 원본 사진은 수 MB라 그대로 localStorage에 못 넣는다 — 카드에 넣을 만큼(긴 변 480px)만 남긴다.
  // 캔버스로 다시 그리면서 사진에 붙어 있던 촬영 위치·시각 정보(EXIF)도 같이 떨어진다.
  function resizeImageFile(file, maxDim) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function (e) {
        var img = new Image();
        img.onload = function () {
          var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
          var w = Math.round(img.width * scale), h = Math.round(img.height * scale);
          var c = document.createElement('canvas');
          c.width = w; c.height = h;
          c.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(c.toDataURL('image/jpeg', 0.85));
        };
        img.onerror = function () { reject(new Error('이미지를 읽지 못했습니다')); };
        img.src = e.target.result;
      };
      reader.onerror = function () { reject(new Error('파일을 읽지 못했습니다')); };
      reader.readAsDataURL(file);
    });
  }

  photoBtn.addEventListener('click', function () { photoInput.click(); });
  photoInput.addEventListener('change', function () {
    var file = photoInput.files[0];
    if (!file) return;
    resizeImageFile(file, 480).then(function (dataUrl) {
      photoDataUrl = dataUrl;
      showPhoto(dataUrl);
    }).catch(function (err) {
      alert('사진을 불러오지 못했습니다: ' + err.message);
    });
  });

  document.getElementById('back-btn').addEventListener('click', function () { showStep(1); });

  // 카드 번호는 이 기기에서 한 번 뽑아 계속 쓴다. 서버가 없어서 다른 사람과 겹칠 수 있는,
  // 카드 꾸밈용 번호다(신청·본인 확인에 쓰는 번호가 아니다).
  function makeCardNo() {
    var n = Math.floor(Math.random() * 9000) + 1000;
    return 'DASAN-' + new Date().getFullYear() + '-' + n;
  }
  function todayText() {
    var d = new Date();
    return d.getFullYear() + '. ' + (d.getMonth() + 1) + '. ' + d.getDate() + '.';
  }

  makeBtn.addEventListener('click', function () {
    var name = fName.value.trim();
    if (!name || !signal) return;
    // 다른 화면이 저장해 둔 값(크기 등)을 지우지 않게 기존 프로필에 덮어쓴다
    var p = loadProfile();
    p.name = name;
    p.signal = signal;
    p.photo = photoDataUrl || p.photo || null;
    if (!p.size) p.size = 'medium';
    if (!p.cardNo) p.cardNo = makeCardNo();
    if (!p.cardIssued) p.cardIssued = todayText();
    if (!saveProfile(p)) {
      alert('저장에 실패했습니다(사진 용량이 너무 클 수 있어요). 카드는 그대로 만들어 드릴게요.');
    }
    profile = p;
    renderCard().then(function () { showStep(3); });
  });

  // ── 3단계: 카드 그리기 ──
  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function loadImage(src) {
    return new Promise(function (resolve) {
      if (!src) { resolve(null); return; }
      var img = new Image();
      img.onload = function () { resolve(img); };
      img.onerror = function () { resolve(null); };
      img.src = src;
    });
  }
  // 글자가 칸을 넘으면 글자 크기를 줄여서 맞춘다(긴 이름 대비)
  function fitText(ctx, text, maxWidth, size, weight) {
    var s = size;
    do {
      ctx.font = weight + ' ' + s + 'px Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
      if (ctx.measureText(text).width <= maxWidth) break;
      s -= 4;
    } while (s > 24);
    return s;
  }
  function font(weight, size) {
    return weight + ' ' + size + 'px Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
  }

  function drawCard(img) {
    var ctx = canvas.getContext('2d');
    var W = canvas.width, H = canvas.height;
    var sig = SIGNALS[profile.signal] || SIGNALS.none;
    var INK = '#4a3f35', SOFT = '#8a7a68', LINE = '#e6d6c1';

    ctx.clearRect(0, 0, W, H);

    // 바탕 + 신호등 색 테두리
    roundRect(ctx, 0, 0, W, H, 64);
    ctx.fillStyle = sig.color;
    ctx.fill();
    roundRect(ctx, 26, 26, W - 52, H - 52, 44);
    ctx.fillStyle = '#fffaf3';
    ctx.fill();

    // 머리줄
    ctx.fillStyle = INK;
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.font = font(800, 76);
    ctx.fillText('댕댕이 주민증', 96, 168);
    ctx.fillStyle = SOFT;
    ctx.font = font(600, 34);
    var subtitle = guardianSpot ? guardianSpot + ' 수호지킴이' : '남양주 다산동 산책 주민';
    ctx.font = font(600, fitText(ctx, subtitle, 900, 34, 600));
    ctx.fillText(subtitle, 100, 222);

    // 오른쪽 위 신호등(불 셋 중 하나만 켜짐)
    var lampOrder = ['green', 'yellow', 'red'];
    var lx = W - 96 - 3 * 76, ly = 96;
    roundRect(ctx, lx - 22, ly - 12, 3 * 76 + 20, 100, 50);
    ctx.fillStyle = '#4a3f35';
    ctx.fill();
    lampOrder.forEach(function (key, i) {
      ctx.beginPath();
      ctx.arc(lx + 26 + i * 76, ly + 38, 28, 0, Math.PI * 2);
      ctx.fillStyle = (key === profile.signal) ? SIGNALS[key].color : '#6f6357';
      ctx.fill();
    });

    ctx.strokeStyle = LINE;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(96, 268); ctx.lineTo(W - 96, 268); ctx.stroke();

    // 사진
    var px = 96, py = 318, pw = 460, ph = 520;
    roundRect(ctx, px, py, pw, ph, 36);
    ctx.fillStyle = '#f3ddd2';
    ctx.fill();
    if (img) {
      ctx.save();
      roundRect(ctx, px, py, pw, ph, 36);
      ctx.clip();
      var scale = Math.max(pw / img.width, ph / img.height);
      var dw = img.width * scale, dh = img.height * scale;
      ctx.drawImage(img, px + (pw - dw) / 2, py + (ph - dh) / 2, dw, dh);
      ctx.restore();
    } else {
      ctx.fillStyle = '#b8563a';
      ctx.textAlign = 'center';
      ctx.font = font(700, 40);
      ctx.fillText('사진 없음', px + pw / 2, py + ph / 2 + 14);
      ctx.textAlign = 'left';
    }

    // 오른쪽 정보
    var tx = 620, maxW = W - 96 - tx;
    ctx.fillStyle = SOFT;
    ctx.font = font(600, 32);
    ctx.fillText('이름', tx, 362);
    ctx.fillStyle = INK;
    var nameSize = fitText(ctx, profile.name, maxW, 124, 800);
    ctx.font = font(800, nameSize);
    ctx.fillText(profile.name, tx - 4, 482);

    // 신호등 문구 띠
    roundRect(ctx, tx, 532, maxW, 132, 30);
    ctx.fillStyle = sig.color;
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.font = font(700, 34);
    ctx.fillText(sig.label, tx + 36, 586);
    var lineSize = fitText(ctx, sig.line, maxW - 72, 50, 800);
    ctx.font = font(800, lineSize);
    ctx.fillText(sig.line, tx + 36, 640);

    // 아래 칸
    var rows = [['발급일', profile.cardIssued || todayText()], ['카드 번호', profile.cardNo || '']];
    rows.forEach(function (row, i) {
      var y = 730 + i * 62;
      ctx.fillStyle = SOFT;
      ctx.font = font(600, 32);
      ctx.fillText(row[0], tx, y);
      ctx.fillStyle = INK;
      ctx.font = font(700, 36);
      ctx.fillText(row[1], tx + 190, y);
    });

    ctx.strokeStyle = LINE;
    ctx.beginPath(); ctx.moveTo(96, 880); ctx.lineTo(W - 96, 880); ctx.stroke();
    // "나도 만들기" QR — 오른쪽 아래 빈자리. 흰 바탕에 사방 여백을 둬야 카메라가 읽는다.
    drawQr(ctx, SHARE_URL, W - 96 - 200, 684, 200);

    ctx.fillStyle = SOFT;
    var footLeft = '왈슨 · ' + SHARE_URL_TEXT;
    ctx.font = font(600, fitText(ctx, footLeft, 760, 30, 600));
    ctx.fillText(footLeft, 96, 934);
    ctx.font = font(600, 30);
    ctx.textAlign = 'right';
    ctx.fillText('재미로 만든 카드예요 · 공식 신분증이 아니에요', W - 96, 934);
    ctx.textAlign = 'left';
  }

  // QR을 size×size 칸에 그린다. 라이브러리가 없으면 아무것도 그리지 않는다.
  function drawQr(ctx, text, x, y, size) {
    if (typeof qrcode !== 'function') return;
    var qr;
    // 오류 정정은 가장 낮은 L — 화면으로 보는 그림이라 긁힐 일이 없고, 칸이 굵어져 작게 줄여도 읽힌다
    try { qr = qrcode(0, 'L'); qr.addData(text); qr.make(); } catch (e) { return; }
    var n = qr.getModuleCount();
    var quiet = 3;                                  // 사방 여백(칸 수)
    var cell = Math.floor(size / (n + quiet * 2));
    var real = cell * (n + quiet * 2);
    var ox = x + size - real, oy = y;               // 오른쪽 위에 맞춘다
    roundRect(ctx, ox, oy, real, real, 14);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    ctx.fillStyle = '#4a3f35';
    for (var r = 0; r < n; r++) {
      for (var c = 0; c < n; c++) {
        if (qr.isDark(r, c)) ctx.fillRect(ox + (c + quiet) * cell, oy + (r + quiet) * cell, cell, cell);
      }
    }
  }

  // 저장 모양: 카드만(1600×1000) / 정사각형(1080×1080, 카톡·피드) / 스토리용(1080×1920).
  // 정사각형·스토리용은 파스텔 바탕 가운데에 카드를 올려서, 올렸을 때 양옆이 잘리지 않게 한다.
  var exportFormat = 'card';
  var exportCanvas = null;
  function composeExport() {
    if (exportFormat === 'card') { exportCanvas = canvas; return canvas; }
    var W = 1080, H = exportFormat === 'story' ? 1920 : 1080;
    var out = document.createElement('canvas');
    out.width = W; out.height = H;
    var ctx = out.getContext('2d');
    var sig = SIGNALS[profile.signal] || SIGNALS.none;
    ctx.fillStyle = '#f7ede2';
    ctx.fillRect(0, 0, W, H);
    // 위아래에 신호등 색 띠를 얇게 — 어떤 신호등인지 멀리서도 보이게
    ctx.fillStyle = sig.color;
    ctx.fillRect(0, 0, W, 18);
    ctx.fillRect(0, H - 18, W, 18);
    var cw = 960, ch = 600, cx = (W - cw) / 2, cy = Math.round((H - ch) / 2) - (exportFormat === 'story' ? 60 : 30);
    ctx.save();
    ctx.shadowColor = 'rgba(74, 63, 53, 0.25)';
    ctx.shadowBlur = 40;
    ctx.shadowOffsetY = 14;
    roundRect(ctx, cx, cy, cw, ch, 38);
    ctx.fillStyle = sig.color;
    ctx.fill();
    ctx.restore();
    ctx.drawImage(canvas, cx, cy, cw, ch);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#4a3f35';
    ctx.font = font(800, 44);
    ctx.fillText(profile.name + ' · ' + sig.line, W / 2, cy + ch + 96);
    ctx.fillStyle = '#8a7a68';
    ctx.font = font(600, 30);
    ctx.fillText('나도 만들기  ' + SHARE_URL_TEXT, W / 2, cy + ch + 150);
    ctx.textAlign = 'left';
    exportCanvas = out;
    return out;
  }
  function refreshPreview() {
    cardImg.src = composeExport().toDataURL('image/png');
  }
  Array.prototype.forEach.call(document.querySelectorAll('.format button'), function (btn) {
    btn.addEventListener('click', function () {
      exportFormat = btn.getAttribute('data-format');
      Array.prototype.forEach.call(document.querySelectorAll('.format button'), function (b) {
        b.setAttribute('aria-pressed', b === btn ? 'true' : 'false');
      });
      refreshPreview();
    });
  });

  function renderCard() {
    // 웹폰트가 아직 안 왔으면 기다렸다가 그린다(안 오면 기기 글꼴로 그려진다)
    var fontsReady = (document.fonts && document.fonts.load)
      ? Promise.all([document.fonts.load('800 76px Pretendard'), document.fonts.load('600 34px Pretendard')]).catch(function () {})
      : Promise.resolve();
    return Promise.all([loadImage(profile.photo), fontsReady]).then(function (res) {
      photoImage = res[0];
      drawCard(photoImage);
      refreshPreview();
      document.getElementById('done-title').textContent = guardianSpot
        ? guardianSpot + ' 수호지킴이 ' + profile.name
        : profile.name + '의 주민증이 나왔어요';
    });
  }

  // 저장: 휴대폰은 공유 시트(사진 앱에 저장 가능), 안 되면 파일로 내려받기
  document.getElementById('save-btn').addEventListener('click', function () {
    (exportCanvas || canvas).toBlob(function (blob) {
      if (!blob) return;
      var fileName = (profile.name || 'dog') + '-주민증' + (exportFormat === 'card' ? '' : '-' + exportFormat) + '.png';
      var file = null;
      try { file = new File([blob], fileName, { type: 'image/png' }); } catch (e) { file = null; }
      if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file] }).catch(function () { /* 사용자가 닫음 */ });
        return;
      }
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = fileName;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    }, 'image/png');
  });

  document.getElementById('redo-btn').addEventListener('click', function () { showStep(1); });

  var channelLink = document.getElementById('channel-link');
  if (KAKAO_CHANNEL_URL) { channelLink.href = KAKAO_CHANNEL_URL; channelLink.hidden = false; }
  var keyringNote = document.getElementById('keyring-note');
  if (KEYRING_NOTE) { keyringNote.textContent = KEYRING_NOTE; keyringNote.hidden = false; }

  // ── 가게 수호지킴이 카드(2026-11-14): start.html?guardian=<스팟 id> ──
  // 동네 지도의 가게 팝업 "주민증 보기"와 관리자 도구에서 온다. 그 가게 강아지 정보(infra-pins.js)로
  // 같은 카드를 그려 보여 주기만 한다 — 내 프로필은 읽지도 바꾸지도 않는다.
  var gm = /[?&]guardian=([^&]+)/.exec(location.search);
  if (gm && window.InfraPins) {
    var gid = decodeURIComponent(gm[1]);
    var spot = InfraPins.all().filter(function (p) { return p.id === gid; })[0];
    if (spot && InfraPins.hasGuardian(spot)) {
      var g = spot.guardian;
      guardianSpot = spot.name || '우리 동네 가게';
      profile = {
        name: g.name, signal: SIGNALS[g.signal] ? g.signal : 'none', photo: g.photo || null,
        cardNo: 'GUARD-' + String(gid).replace(/[^0-9A-Za-z]/g, '').slice(-4).toUpperCase(),
        cardIssued: (spot.verifiedAt || '').replace(/-/g, '. ') + (spot.verifiedAt ? '.' : '')
      };
      document.getElementById('redo-btn').hidden = true;
      document.querySelector('#step-3 .lead').textContent = g.line || '이 가게를 지키는 강아지예요.';
      document.querySelector('.foot').hidden = true;
      renderCard().then(function () { showStep(3); });
      return;
    }
  }

  // 이미 만든 적이 있으면 바로 카드를 보여 준다(다시 들어온 사람이 처음부터 하지 않게)
  if (profile.name && SIGNALS[profile.signal] && profile.signal !== 'none' && profile.cardNo) {
    renderCard().then(function () { showStep(3); });
  }
})();
</script>

</body>
