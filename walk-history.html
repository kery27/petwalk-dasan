<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>산책 기록</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f7ede2">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
  :root {
    /* index.html과 동일한 색 토큰 — 두 화면이 같은 브랜드로 보이게 유지 */
    --bg: #f7ede2; --panel: #fffaf3; --panel-border: #e6d6c1;
    --ink: #4a3f35; --ink-soft: #6b5d4e; --accent: #b8563a; --accent-tint: #f3ddd2;
    --ok: #5f8f5a; --shadow-rgb: 74, 63, 53;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; min-height: 100%; font-family: 'Pretendard', -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color: var(--ink); background: var(--bg);
  }
  body { padding: 16px 16px 32px; }
  .wrap { max-width: 480px; margin: 0 auto; }

  .topbar { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .topbar a {
    flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    width: 34px; height: 34px; border-radius: 12px; text-decoration: none;
    background: var(--panel); border: 1px solid var(--panel-border); color: var(--ink);
    box-shadow: 0 2px 8px rgba(var(--shadow-rgb), 0.1);
  }
  /* Black Han Sans는 굵기가 하나뿐이라 항상 아주 두꺼운데, 제목처럼 획이 많은 한글
     조합에서는 오히려 안 읽힌다는 피드백을 받음(카드 시안 B에서 같은 이유로 이미 한 번
     뺐던 적 있음, PROJECT_CONTEXT.md "시안 B: 스킬 제목 폰트/색상 커스터마이징" 참고) —
     두께 대신 크기로 존재감을 냄. */
  .topbar h1 {
    font-family: 'Pretendard', -apple-system, sans-serif;
    font-weight: 800; font-size: 22px; margin: 0; letter-spacing: -0.01em;
  }
  .subtitle { margin: 6px 0 18px; font-size: 13px; color: var(--ink-soft); }

  .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
  .summary .tile {
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 14px;
    padding: 12px 8px; text-align: center; box-shadow: 0 3px 10px rgba(var(--shadow-rgb), 0.08);
  }
  .summary .tile .num {
    font-family: 'Black Han Sans', 'Pretendard', sans-serif; font-size: 19px; color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  .summary .tile .label { font-size: 11px; color: var(--ink-soft); margin-top: 2px; }

  .list { display: flex; flex-direction: column; gap: 10px; }
  .walk-card {
    display: flex; align-items: center; gap: 14px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 16px;
    padding: 12px 14px; box-shadow: 0 3px 12px rgba(var(--shadow-rgb), 0.08);
  }
  .thumb {
    flex-shrink: 0; width: 56px; height: 56px; border-radius: 14px;
    background: var(--accent-tint); display: flex; align-items: center; justify-content: center;
  }
  .thumb svg { width: 40px; height: 40px; }
  .thumb .no-route { font-size: 10px; color: var(--ink-soft); text-align: center; line-height: 1.3; }

  .info { flex: 1; min-width: 0; }
  .info .top-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .info .date { font-weight: 800; font-size: 14px; }
  .info .streak { font-size: 10px; font-weight: 700; color: var(--ok); white-space: nowrap; }
  .info .stats {
    display: flex; gap: 10px; margin-top: 4px; font-size: 12px; color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }
  .info .stats b { color: var(--ink); font-weight: 700; }

  .empty {
    text-align: center; padding: 60px 20px; color: var(--ink-soft);
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 16px;
  }
  .empty .icon { font-size: 34px; margin-bottom: 10px; }
  .empty p { margin: 0; font-size: 13px; line-height: 1.6; }
</style>
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <a href="index.html" title="지도로 돌아가기">←</a>
    <h1>🐾 산책 기록</h1>
  </div>
  <p class="subtitle" id="subtitle"></p>

  <div class="summary">
    <div class="tile"><div class="num" id="s-count">0</div><div class="label">이번 달 산책</div></div>
    <div class="tile"><div class="num" id="s-distance">0</div><div class="label">누적 km</div></div>
    <div class="tile"><div class="num" id="s-streak">0</div><div class="label">연속 일수</div></div>
  </div>

  <div class="list" id="list"></div>
  <div class="empty" id="empty" hidden>
    <div class="icon">🐾</div>
    <p>아직 산책 기록이 없어요.<br>지도 화면에서 "산책 시작"을 눌러 첫 기록을 남겨보세요.</p>
  </div>
</div>

<script>
(function () {
  var WALKS_KEY = 'petwalk_walks'; // index.html과 같은 키 — 같은 오리진이라 localStorage 공유됨

  function pad2(n) { return n < 10 ? '0' + n : '' + n; }
  function dateKey(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }

  function loadWalks() {
    try { return JSON.parse(localStorage.getItem(WALKS_KEY)) || []; } catch (e) { return []; }
  }

  function computeStreakDays(walks) {
    var days = {};
    walks.forEach(function (w) { days[w.date] = true; });
    var streak = 0;
    var d = new Date();
    while (days[dateKey(d)]) { streak++; d.setDate(d.getDate() - 1); }
    return streak;
  }

  function walksThisMonthCount(walks) {
    var ym = dateKey(new Date()).slice(0, 7);
    return walks.filter(function (w) { return w.date.slice(0, 7) === ym; }).length;
  }

  // 저장된 좌표([lat,lng]...)를 정사각형 썸네일 안에 들어오게 정규화해서 SVG polyline
  // points 문자열로 바꾼다 — 위도가 커질수록 화면에서는 위로 가야 해서(y축 반전).
  function routeThumbnailPoints(route, size) {
    if (!route || route.length < 2) return null;
    var lats = route.map(function (p) { return p[0]; });
    var lngs = route.map(function (p) { return p[1]; });
    var minLat = Math.min.apply(null, lats), maxLat = Math.max.apply(null, lats);
    var minLng = Math.min.apply(null, lngs), maxLng = Math.max.apply(null, lngs);
    var latRange = (maxLat - minLat) || 0.00001;
    var lngRange = (maxLng - minLng) || 0.00001;
    var pad = size * 0.16;
    var innerSize = size - pad * 2;
    var scale = Math.min(innerSize / lngRange, innerSize / latRange);
    var drawnW = lngRange * scale, drawnH = latRange * scale;
    var offsetX = pad + (innerSize - drawnW) / 2;
    var offsetY = pad + (innerSize - drawnH) / 2;
    return route.map(function (p) {
      var x = offsetX + (p[1] - minLng) * scale;
      var y = offsetY + (maxLat - p[0]) * scale;
      return x.toFixed(1) + ',' + y.toFixed(1);
    }).join(' ');
  }

  function pace(distanceKm, durationMin) {
    if (!distanceKm) return '-';
    var minPerKm = durationMin / distanceKm;
    var m = Math.floor(minPerKm);
    var s = Math.round((minPerKm - m) * 60);
    if (s === 60) { m += 1; s = 0; }
    return m + "'" + (s < 10 ? '0' : '') + s + '"/km';
  }

  function formatDate(dateStr) {
    var today = dateKey(new Date());
    var yesterday = new Date();
    yesterday.setDate(yesterday.getDate() - 1);
    if (dateStr === today) return '오늘';
    if (dateStr === dateKey(yesterday)) return '어제';
    var parts = dateStr.split('-');
    return parseInt(parts[1], 10) + '월 ' + parseInt(parts[2], 10) + '일';
  }

  // 스트릭 뱃지 — index.html의 스트릭 표시와 같은 톤(압박/페널티 없는 순수 정보성,
  // PROJECT_CONTEXT.md "최종 결정: 보상 개념 자체를 폐기" 참고): 그날까지 이어진 연속
  // 일수를 보여줄 뿐, 몇 등/달성 같은 판정은 하지 않는다.
  function streakAtDate(walks, dateStr) {
    var days = {};
    walks.forEach(function (w) { days[w.date] = true; });
    var streak = 0;
    var d = new Date(dateStr + 'T00:00:00');
    while (days[dateKey(d)]) { streak++; d.setDate(d.getDate() - 1); }
    return streak;
  }

  var walks = loadWalks();
  var listEl = document.getElementById('list');
  var emptyEl = document.getElementById('empty');
  var subtitleEl = document.getElementById('subtitle');

  if (!walks.length) {
    emptyEl.hidden = false;
    subtitleEl.textContent = '아직 기록 없음';
  } else {
    var totalKm = walks.reduce(function (sum, w) { return sum + w.distanceKm; }, 0);
    var streak = computeStreakDays(walks);
    document.getElementById('s-count').textContent = walksThisMonthCount(walks);
    document.getElementById('s-distance').textContent = totalKm.toFixed(1);
    document.getElementById('s-streak').textContent = streak;
    subtitleEl.textContent = '이번 달 ' + walksThisMonthCount(walks) + '번 산책 · 총 ' +
      totalKm.toFixed(1) + 'km' + (streak > 0 ? ' · 연속 ' + streak + '일째' : '');

    walks.slice().reverse().forEach(function (w) { // 최신 산책이 위로 오게
      var points = routeThumbnailPoints(w.route, 40);
      var thumbInner = points
        ? '<svg viewBox="0 0 40 40" fill="none" stroke="currentColor" style="color:var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="' + points + '"/></svg>'
        : '<span class="no-route">기록<br>없음</span>';
      var dayStreak = streakAtDate(walks, w.date);

      var card = document.createElement('div');
      card.className = 'walk-card';
      card.innerHTML =
        '<div class="thumb">' + thumbInner + '</div>' +
        '<div class="info">' +
          '<div class="top-row"><span class="date">' + formatDate(w.date) + '</span>' +
          (dayStreak > 1 ? '<span class="streak">연속 ' + dayStreak + '일째</span>' : '') + '</div>' +
          '<div class="stats"><span><b>' + w.distanceKm.toFixed(1) + 'km</b></span>' +
          '<span>' + w.durationMin + '분</span>' +
          '<span>' + pace(w.distanceKm, w.durationMin) + '</span></div>' +
        '</div>';
      listEl.appendChild(card);
    });
  }
})();
</script>

</body>
</html>
