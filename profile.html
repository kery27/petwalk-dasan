<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>프로필</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f7ede2">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root {
    /* index.html/walk-history.html과 동일한 색 토큰 */
    --bg: #f7ede2; --panel: #fffaf3; --panel-border: #e6d6c1;
    --ink: #4a3f35; --ink-soft: #6b5d4e; --accent: #b8563a; --accent-tint: #f3ddd2;
    --shadow-rgb: 74, 63, 53;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; min-height: 100%; font-family: 'Pretendard', -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color: var(--ink); background: var(--bg);
  }
  body { padding: 16px 16px 32px; }
  .wrap { max-width: 420px; margin: 0 auto; }

  .topbar { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .topbar a {
    flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    width: 34px; height: 34px; border-radius: 12px; text-decoration: none;
    background: var(--panel); border: 1px solid var(--panel-border); color: var(--ink);
    box-shadow: 0 2px 8px rgba(var(--shadow-rgb), 0.1);
  }
  .topbar h1 { font-weight: 800; font-size: 20px; margin: 0; letter-spacing: -0.01em; }

  .card {
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 18px;
    padding: 24px 20px; box-shadow: 0 4px 16px rgba(var(--shadow-rgb), 0.1);
  }

  .photo-picker { display: flex; justify-content: center; margin-bottom: 22px; }
  .photo-btn {
    position: relative; width: 108px; height: 108px; border-radius: 50%;
    background: var(--accent-tint); border: 2px dashed var(--panel-border);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    overflow: hidden; padding: 0;
  }
  .photo-btn img { width: 100%; height: 100%; object-fit: cover; display: none; }
  .photo-btn .placeholder { font-size: 30px; color: var(--accent); }
  .photo-btn .edit-badge {
    position: absolute; bottom: 2px; right: 2px; width: 30px; height: 30px; border-radius: 50%;
    background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 13px; border: 2px solid var(--panel);
  }
  #photo-input { display: none; }

  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 12px; font-weight: 700; color: var(--ink-soft); margin-bottom: 6px; }
  .field input, .field select {
    width: 100%; font-family: 'Pretendard', sans-serif; font-size: 15px; padding: 11px 12px;
    border: 1px solid var(--panel-border); border-radius: 10px; color: var(--ink); background: #fff;
  }

  .btn-save {
    width: 100%; border: none; border-radius: 999px; padding: 14px; margin-top: 6px;
    background: linear-gradient(180deg, #c96b4f 0%, var(--accent) 100%); color: #fff;
    font-family: 'Pretendard', sans-serif; font-weight: 700; font-size: 15px; cursor: pointer;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), inset 0 -3px 6px rgba(0,0,0,0.15), 0 6px 16px rgba(var(--shadow-rgb), 0.3);
  }
  .btn-save:active { transform: scale(0.98); }

  .hint { font-size: 12px; color: var(--ink-soft); line-height: 1.6; margin: 14px 2px 0; }
  .saved-toast {
    text-align: center; font-size: 13px; font-weight: 700; color: var(--accent);
    margin-top: 10px; opacity: 0; transition: opacity 0.3s ease;
  }
  .saved-toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <a href="index.html" title="지도로 돌아가기">←</a>
    <h1>🐾 프로필</h1>
  </div>

  <div class="card">
    <div class="photo-picker">
      <button type="button" class="photo-btn" id="photo-btn">
        <img id="photo-preview" alt="">
        <span class="placeholder" id="photo-placeholder">🐾</span>
        <span class="edit-badge">✎</span>
      </button>
      <input type="file" id="photo-input" accept="image/*">
    </div>

    <div class="field">
      <label for="f-name">이름</label>
      <input id="f-name" placeholder="코코" maxlength="20">
    </div>

    <div class="field">
      <label for="f-size">크기 (추천 루트 예상 시간에 쓰여요)</label>
      <select id="f-size">
        <option value="small">소형견 (말티즈·포메라니안·치와와 등)</option>
        <option value="medium" selected>중형견 (비글·시바견·웰시코기 등)</option>
        <option value="large">대형견 (리트리버·진돗개·허스키 등)</option>
      </select>
    </div>

    <button class="btn-save" id="save-btn">프로필 저장</button>
    <div class="saved-toast" id="toast">저장됐어요!</div>
  </div>

  <p class="hint">
    로그인 없이 이 기기에만 저장돼요(다른 기기와는 공유되지 않아요). 견주 이름은 따로 받지
    않고, 반려동물 정보만 등록합니다.
  </p>
</div>

<script>
(function () {
  var PROFILE_KEY = 'petwalk_profile'; // index.html이 견종 크기 기본값으로 같이 읽어감

  var photoBtn = document.getElementById('photo-btn');
  var photoInput = document.getElementById('photo-input');
  var photoPreview = document.getElementById('photo-preview');
  var photoPlaceholder = document.getElementById('photo-placeholder');
  var fName = document.getElementById('f-name');
  var fSize = document.getElementById('f-size');
  var saveBtn = document.getElementById('save-btn');
  var toast = document.getElementById('toast');

  var photoDataUrl = null;

  function loadProfile() {
    try { return JSON.parse(localStorage.getItem(PROFILE_KEY)); } catch (e) { return null; }
  }

  function showPhoto(dataUrl) {
    if (!dataUrl) {
      photoPreview.style.display = 'none';
      photoPlaceholder.style.display = 'block';
      return;
    }
    photoPreview.src = dataUrl;
    photoPreview.style.display = 'block';
    photoPlaceholder.style.display = 'none';
  }

  var existing = loadProfile();
  if (existing) {
    fName.value = existing.name || '';
    if (existing.size) fSize.value = existing.size;
    photoDataUrl = existing.photo || null;
    showPhoto(photoDataUrl);
  }

  photoBtn.addEventListener('click', function () { photoInput.click(); });

  // 원본 사진을 그대로 localStorage에 넣으면 용량이 금방 커지니(localStorage는 보통
  // 5~10MB 한도), 캔버스로 축소해서 저장한다 — 프로필 원형 썸네일 정도로만 쓰이므로
  // 240px면 충분히 선명함.
  function resizeImageFile(file, maxDim) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function (e) {
        var img = new Image();
        img.onload = function () {
          var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
          var w = Math.round(img.width * scale), h = Math.round(img.height * scale);
          var canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', 0.85));
        };
        img.onerror = function () { reject(new Error('이미지를 읽지 못했습니다')); };
        img.src = e.target.result;
      };
      reader.onerror = function () { reject(new Error('파일을 읽지 못했습니다')); };
      reader.readAsDataURL(file);
    });
  }

  photoInput.addEventListener('change', function () {
    var file = photoInput.files[0];
    if (!file) return;
    resizeImageFile(file, 240).then(function (dataUrl) {
      photoDataUrl = dataUrl;
      showPhoto(photoDataUrl);
    }).catch(function (err) {
      alert('사진을 불러오지 못했습니다: ' + err.message);
    });
  });

  saveBtn.addEventListener('click', function () {
    var profile = {
      name: fName.value.trim(),
      size: fSize.value,
      photo: photoDataUrl
    };
    try {
      localStorage.setItem(PROFILE_KEY, JSON.stringify(profile));
      toast.classList.add('show');
      setTimeout(function () { toast.classList.remove('show'); }, 1800);
    } catch (e) {
      alert('저장에 실패했습니다(사진 용량이 너무 클 수 있어요): ' + e.message);
    }
  });
})();
</script>

</body>
</html>
