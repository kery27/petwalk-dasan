<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스팟 편집 (운영자)</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="spots-data.js"></script>
<script src="infra-pins.js?v=6"></script>
<script src="spot-github.js?v=1"></script>
<style>
  /* 스팟 편집 — 운영자 전용(2026-11-15 다시 정리, 기획표 V0-18).
     배포된 사이트에 있지만, GitHub 토큰을 넣은 브라우저(= 운영자 컴퓨터)에서만 쓸 수 있다.
     그 브라우저에서만 [동네] 지도에 "스팟 편집" 버튼이 보인다(infra-pins.js isAdminDevice).

     흐름: 고치면 먼저 이 컴퓨터에만 저장(초안) → "모두에게 반영"을 누르면 spots-data.js·spots/photos/를
     커밋 하나로 저장소에 올린다(spot-github.js) → GitHub Pages가 다시 배포 → 몇 분 뒤 모든 사람에게 보인다.
     가게 이름과 강아지 사진은 가게 주인이 올려도 된다고 한 것만 넣는다. */
  :root {
    --bg: #f7ede2; --panel: #fffaf3; --panel-border: #e6d6c1;
    --ink: #4a3f35; --ink-soft: #6b5d4e; --accent: #b8563a; --danger: #b3261e; --ok: #3f7d4a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: 'Pretendard', -apple-system, "Malgun Gothic", sans-serif; color: var(--ink); background: var(--bg); font-size: 13px; }
  body { display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px; background: var(--panel); border-bottom: 1px solid var(--panel-border); flex-wrap: wrap; }
  .topbar h1 { font-size: 16px; margin: 0; }
  .topbar a { color: var(--accent); font-size: 13px; font-weight: 700; text-decoration: none; }

  /* 배포 상태 띠 */
  .status { display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: #fdf3ec; border-bottom: 1px solid var(--panel-border); flex-wrap: wrap; }
  .status .msg { flex: 1; min-width: 200px; font-weight: 700; }
  .status.is-clean { background: #eef5ec; }
  .status.is-error { background: #fbe9e7; color: var(--danger); }
  .blocked { margin: 40px auto; max-width: 520px; padding: 24px; background: var(--panel); border: 1px solid var(--panel-border); border-radius: 16px; line-height: 1.7; font-size: 14px; }
  .blocked code { background: #efe0cd; padding: 1px 6px; border-radius: 6px; }

  .layout { flex: 1; display: flex; min-height: 0; }
  #map { flex: 1; min-height: 260px; }
  .side { width: 400px; overflow-y: auto; padding: 14px; background: var(--panel); border-left: 1px solid var(--panel-border); }
  @media (max-width: 860px) {
    .layout { flex-direction: column; }
    #map { flex: none; height: 42vh; }
    .side { width: 100%; border-left: none; border-top: 1px solid var(--panel-border); flex: 1; }
  }

  .section { margin-bottom: 22px; }
  .section h2 { font-size: 13px; margin: 0 0 10px; color: var(--ink-soft); font-weight: 700; }
  .hint { font-size: 12px; color: var(--ink-soft); line-height: 1.6; margin: 0 0 10px; }
  .stats { font-size: 13px; font-weight: 700; margin-bottom: 10px; }
  .stats span { color: var(--accent); }

  button { font-family: inherit; font-size: 12px; font-weight: 700; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--panel-border); background: #fff; color: var(--ink); cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); width: 100%; padding: 11px; font-size: 13px; }
  button.publish { background: var(--ok); color: #fff; border-color: var(--ok); padding: 9px 14px; font-size: 13px; }
  button.danger { color: var(--danger); }

  .field { margin-bottom: 8px; }
  .field label { display: block; font-size: 11px; color: var(--ink-soft); margin-bottom: 3px; font-weight: 700; }
  .field input, .field select { width: 100%; font-family: inherit; font-size: 14px; padding: 8px 9px; border: 1px solid var(--panel-border); border-radius: 8px; color: var(--ink); background: #fff; }

  .photo-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .photo-row .thumb { width: 72px; height: 72px; border-radius: 12px; background: #f3ddd2; overflow: hidden; flex-shrink: 0; }
  .photo-row .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo-row .thumb img[hidden] { display: none; }
  .photo-row input[type=file] { display: none; }

  .spot-extra, .guardian { border-radius: 12px; padding: 12px; margin: 10px 0; }
  .spot-extra { border: 1px solid var(--panel-border); background: #fff; }
  .guardian { border: 1px dashed var(--accent); background: #fdf3ec; }
  .spot-extra[hidden], .guardian[hidden] { display: none; }
  .guardian h3, .spot-extra h3 { font-size: 13px; margin: 0 0 4px; color: var(--accent); }

  #pin-list { list-style: none; margin: 0 0 10px; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  #pin-list li { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border: 1px solid var(--panel-border); border-radius: 8px; background: #fff; }
  #pin-list li.is-editing { border-color: var(--accent); background: #fdf3ec; }
  #pin-list .face { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
  #pin-list .info { flex: 1; min-width: 0; cursor: pointer; }
  #pin-list .name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #pin-list .meta { color: var(--ink-soft); font-size: 11px; }
  #pin-list button { padding: 4px 7px; font-size: 11px; flex-shrink: 0; }
  .filter select { width: 100%; font-family: inherit; font-size: 13px; padding: 6px; border: 1px solid var(--panel-border); border-radius: 8px; background: #fff; color: var(--ink); margin-bottom: 8px; }

  .draft-marker { width: 22px; height: 22px; border-radius: 50%; border: 3px dashed var(--accent); background: rgba(184, 86, 58, 0.25); box-shadow: 0 2px 6px rgba(0,0,0,0.3); }
</style>
</head>
<body>

<div class="topbar">
  <h1>스팟 편집 <span style="font-weight:500;color:var(--ink-soft);font-size:12px;">운영자 전용</span></h1>
  <span style="display:flex;gap:14px;align-items:center;">
    <a href="town.html">← 동네 지도</a>
    <button type="button" id="reload-btn" style="padding:5px 9px;">다시 불러오기</button>
    <button type="button" id="logout-btn" style="padding:5px 9px;">토큰 지우기</button>
  </span>
</div>

<div class="status" id="status">
  <span class="msg" id="status-msg">불러오는 중…</span>
  <button type="button" class="publish" id="publish-btn" disabled>모두에게 반영</button>
</div>

<div class="layout" id="layout" hidden>
  <div id="map"></div>

  <div class="side">
    <div class="section">
      <h2 id="form-title">1. 새 스팟 넣기</h2>
      <p class="hint" id="form-hint">지도에서 자리를 한 번 누르면 점선 원이 생깁니다. 다시 누르면 옮겨집니다.</p>
      <div class="stats">위치: <span id="draft-pos">아직 없음</span></div>

      <div class="field"><label for="f-cat">종류</label><select id="f-cat"></select></div>
      <div class="field"><label for="f-name">이름 (예: 다산 수제간식 공방)</label><input id="f-name" maxlength="40"></div>
      <div class="field"><label for="f-tags">조건 태그 (쉼표로 구분, 예: 실내OK, 대형견OK)</label><input id="f-tags" maxlength="80"></div>
      <div class="field"><label for="f-note">메모 (예: 봉투가 자주 비어 있음)</label><input id="f-note" maxlength="80"></div>
      <div class="field"><label for="f-phone">전화번호 (가게·병원만, 선택)</label><input id="f-phone" inputmode="tel" maxlength="20"></div>

      <div class="spot-extra" id="spot-extra" hidden>
        <h3>가게 사진 (선택)</h3>
        <p class="hint">수호지킴이 사진이 없을 때 지도에 이 사진이 크게 나옵니다.</p>
        <div class="photo-row">
          <div class="thumb"><img id="p-preview" alt="" hidden></div>
          <div>
            <button type="button" id="p-pick">사진 고르기</button>
            <button type="button" id="p-clear" hidden>사진 빼기</button>
            <input type="file" id="p-input" accept="image/*">
          </div>
        </div>
      </div>

      <div class="guardian" id="guardian-box" hidden>
        <h3>수호지킴이 (이 가게를 지키는 강아지)</h3>
        <p class="hint">가게 주인이 알려 주고, 올려도 된다고 한 강아지만 넣어 주세요. 이름을 비워 두면 수호지킴이 없이 저장됩니다.</p>
        <div class="photo-row">
          <div class="thumb"><img id="g-preview" alt="" hidden></div>
          <div>
            <button type="button" id="g-pick">사진 고르기</button>
            <button type="button" id="g-clear" hidden>사진 빼기</button>
            <input type="file" id="g-input" accept="image/*">
          </div>
        </div>
        <div class="field"><label for="g-name">강아지 이름</label><input id="g-name" maxlength="10"></div>
        <div class="field">
          <label for="g-signal">산책 신호등 (손님 강아지를 만났을 때)</label>
          <select id="g-signal">
            <option value="">안 정함</option>
            <option value="green">초록불 — 다가와도 좋아요</option>
            <option value="yellow">노랑불 — 천천히 인사해요</option>
            <option value="red">빨강불 — 눈으로만 예뻐해 주세요</option>
          </select>
        </div>
        <div class="field"><label for="g-line">한마디 (선택, 예: 간식 주면 손 줘요)</label><input id="g-line" maxlength="30"></div>
        <button type="button" id="g-card-btn" disabled>주민증 카드 보기</button>
      </div>

      <button class="primary" id="save-btn" disabled>이 스팟 추가</button>
      <button type="button" id="cancel-btn" style="margin-top:8px;width:100%;" hidden>고치기 그만두기</button>
    </div>

    <div class="section">
      <h2>2. 스팟 목록 (<span id="pin-count">0</span>)</h2>
      <div class="filter"><select id="list-filter" aria-label="종류로 걸러 보기"></select></div>
      <p class="hint">이름을 누르면 지도가 그 자리로 갑니다. 지도에서 핀을 눌러도 고치기가 열립니다.</p>
      <ul id="pin-list"></ul>
    </div>
  </div>
</div>

<div class="blocked" id="blocked" hidden></div>

<script>
(function () {
  var DEFAULT_CENTER = [37.6212, 127.1525];
  var $ = function (id) { return document.getElementById(id); };

  // ── 운영자 기기 확인: GitHub 토큰이 이 브라우저에 있어야 편집·반영할 수 있다(spot-github.js) ──
  function block(html) {
    $('layout').hidden = true;
    $('status').hidden = true;
    $('blocked').innerHTML = html;
    $('blocked').hidden = false;
  }

  var DRAFT_KEY = 'petwalk_spot_draft';   // 반영 전 편집 내용 — 이 브라우저에만 둔다(창을 닫아도 남게)
  var spots = [];          // 지금 편집 중인 전체 목록
  var baseSpots = [];      // 저장소(main)에 올라가 있는 목록
  var baseSha = null;      // 그 목록을 읽은 커밋
  var busy = false;

  function sameSpot(a, b) { return JSON.stringify(a) === JSON.stringify(b); }
  function pendingCount() {
    var byId = {}, n = 0;
    baseSpots.forEach(function (s) { byId[s.id] = s; });
    spots.forEach(function (s) { if (!byId[s.id] || !sameSpot(byId[s.id], s)) n++; delete byId[s.id]; });
    return n + Object.keys(byId).length;   // 바뀐 것 + 새로 넣은 것 + 지운 것
  }
  function saveDraft() {
    try {
      if (pendingCount()) localStorage.setItem(DRAFT_KEY, JSON.stringify({ baseSha: baseSha, spots: spots }));
      else localStorage.removeItem(DRAFT_KEY);
      return true;
    } catch (e) { return false; }
  }
  function renderStatus(errText) {
    var bar = $('status'), msg = $('status-msg'), btn = $('publish-btn');
    var pending = pendingCount();
    bar.className = 'status';
    if (errText) {
      bar.classList.add('is-error');
      msg.textContent = errText;
    } else if (pending > 0) {
      msg.textContent = '이 컴퓨터에만 저장됨 · 아직 모두에게 반영 안 한 변경 ' + pending + '개';
    } else {
      bar.classList.add('is-clean');
      msg.textContent = '모두 반영됨 — 서비스와 같은 내용이에요';
    }
    btn.disabled = busy || pending === 0;
  }
  // 고친 내용은 먼저 이 컴퓨터에 둔다. "모두에게 반영"을 눌러야 커밋된다.
  function save() {
    if (!saveDraft()) {
      renderStatus('이 브라우저 저장 공간이 부족해요. 사진을 줄이거나 먼저 반영해 주세요.');
    } else {
      renderAll();
      renderStatus();
    }
    return Promise.resolve();
  }

  $('publish-btn').addEventListener('click', function () {
    var n = pendingCount();
    if (!n || busy) return;
    if (!confirm('바뀐 스팟 ' + n + '개를 저장소에 커밋해서 모든 사람에게 보이게 할까요?\n(반영된 뒤 서비스에 보이기까지 몇 분 걸려요)')) return;
    busy = true; renderStatus();
    $('status-msg').textContent = 'GitHub에 올리는 중…';
    SpotGitHub.publish(spots, baseSha).then(function (res) {
      busy = false;
      baseSha = res.headSha;
      spots = res.spots;                 // 사진이 파일 경로로 바뀐 목록
      baseSpots = JSON.parse(JSON.stringify(res.spots));
      try { localStorage.removeItem(DRAFT_KEY); } catch (e) { /* 무시 */ }
      clearForm();
      renderAll();
      renderStatus();
      alert(res.nothing ? '바뀐 내용이 없어서 커밋하지 않았어요.' : '커밋했어요. 몇 분 뒤 모든 사람의 동네 지도에 보여요.');
    }).catch(function (e) {
      busy = false;
      renderStatus('반영하지 못했어요: ' + e.message);
    });
  });

  $('reload-btn').addEventListener('click', function () {
    if (pendingCount() && !confirm('반영 안 한 변경을 버리고 저장소의 최신 내용을 다시 불러올까요?')) return;
    try { localStorage.removeItem(DRAFT_KEY); } catch (e) { /* 무시 */ }
    location.reload();
  });
  $('logout-btn').addEventListener('click', function () {
    if (!confirm('이 브라우저에서 GitHub 토큰을 지울까요?\n지우면 이 컴퓨터에서도 편집 버튼이 사라져요.')) return;
    SpotGitHub.setToken('');
    location.href = 'town.html';
  });
  // ── 지도·폼 ──
  var map = null, markers = {}, draftLatLng = null, draftMarker = null;
  var editingId = null, gPhoto = null, pPhoto = null;
  var fCat = $('f-cat'), fName = $('f-name'), fTags = $('f-tags'), fNote = $('f-note'), fPhone = $('f-phone');
  var gName = $('g-name'), gSignal = $('g-signal'), gLine = $('g-line');

  // 사진 경로는 저장소 최상위 기준(spots/photos/…) — 이 페이지도 최상위에 있어 그대로 쓴다
  function src(p) { return p || ''; }
  function pad2(n) { return n < 10 ? '0' + n : '' + n; }
  function todayText() { var d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function round5(x) { return Math.round(x * 1e5) / 1e5; }

  function setDraft(latlng) {
    draftLatLng = latlng;
    if (!latlng) {
      if (draftMarker) { map.removeLayer(draftMarker); draftMarker = null; }
      $('draft-pos').textContent = '아직 없음';
    } else {
      if (draftMarker) draftMarker.setLatLng(latlng);
      else draftMarker = L.marker(latlng, { icon: L.divIcon({ className: 'draft-marker', iconSize: [22, 22], iconAnchor: [11, 11] }), interactive: false, zIndexOffset: 2000 }).addTo(map);
      $('draft-pos').textContent = latlng.lat.toFixed(5) + ', ' + latlng.lng.toFixed(5);
    }
    $('save-btn').disabled = !draftLatLng;
  }

  function photoField(prefix, setter) {
    var preview = $(prefix + '-preview'), clear = $(prefix + '-clear'), input = $(prefix + '-input');
    function show(v) { setter(v || null); preview.hidden = !v; if (v) preview.src = src(v); clear.hidden = !v; }
    $(prefix + '-pick').addEventListener('click', function () { input.click(); });
    clear.addEventListener('click', function () { show(null); });
    input.addEventListener('change', function () {
      var file = input.files[0];
      if (!file) return;
      resizeImageFile(file, 640).then(show).catch(function (err) { alert('사진을 불러오지 못했습니다: ' + err.message); });
      input.value = '';
    });
    return show;
  }
  // 지도 팝업에 크게 나오도록 긴 변 640px로 줄인다. 캔버스로 다시 그리면서 촬영 위치·시각 정보(EXIF)가 빠진다.
  function resizeImageFile(file, maxDim) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function (e) {
        var img = new Image();
        img.onload = function () {
          var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
          var c = document.createElement('canvas');
          c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          resolve(c.toDataURL('image/jpeg', 0.82));
        };
        img.onerror = function () { reject(new Error('이미지를 읽지 못했습니다')); };
        img.src = e.target.result;
      };
      reader.onerror = function () { reject(new Error('파일을 읽지 못했습니다')); };
      reader.readAsDataURL(file);
    });
  }
  var showGPhoto = photoField('g', function (v) { gPhoto = v; });
  var showPPhoto = photoField('p', function (v) { pPhoto = v; });

  function refreshExtras() {
    var isSpot = fCat.value === 'spot';
    $('guardian-box').hidden = !isSpot;
    $('spot-extra').hidden = !isSpot;
    // 카드는 서비스에 올라간 내용으로 그리므로, 반영된 수호지킴이만 볼 수 있다
    var saved = editingId && baseSpots.some(function (s) { return s.id === editingId && InfraPins.hasGuardian(s); });
    $('g-card-btn').disabled = !saved;
    $('g-card-btn').textContent = saved ? '주민증 카드 보기' : '주민증 카드 보기 (모두에게 반영한 뒤에)';
  }
  fCat.addEventListener('change', refreshExtras);
  $('g-card-btn').addEventListener('click', function () {
    if (editingId) window.open('start.html?guardian=' + encodeURIComponent(editingId), '_blank');
  });

  function clearForm() {
    editingId = null;
    fName.value = ''; fTags.value = ''; fNote.value = ''; fPhone.value = '';
    gName.value = ''; gSignal.value = ''; gLine.value = '';
    showGPhoto(null); showPPhoto(null);
    setDraft(null);
    $('form-title').textContent = '1. 새 스팟 넣기';
    $('form-hint').textContent = '지도에서 자리를 한 번 누르면 점선 원이 생깁니다. 다시 누르면 옮겨집니다.';
    $('save-btn').textContent = '이 스팟 추가';
    $('cancel-btn').hidden = true;
    refreshExtras();
  }
  function startEdit(pin) {
    editingId = pin.id;
    fCat.value = pin.cat;
    fName.value = pin.name || '';
    fTags.value = (pin.tags || []).join(', ');
    fNote.value = pin.note || '';
    fPhone.value = pin.phone || '';
    var g = pin.guardian || {};
    gName.value = g.name || ''; gSignal.value = g.signal || ''; gLine.value = g.line || '';
    showGPhoto(g.photo || null);
    showPPhoto(pin.photo || null);
    setDraft(L.latLng(pin.lat, pin.lng));
    map.setView([pin.lat, pin.lng], Math.max(map.getZoom(), 17));
    $('form-title').textContent = '1. 스팟 고치기 — ' + (pin.name || '');
    $('form-hint').textContent = '위치를 옮기려면 지도에서 새 자리를 누르세요. 다 고쳤으면 "고친 내용 저장".';
    $('save-btn').textContent = '고친 내용 저장';
    $('cancel-btn').hidden = false;
    refreshExtras();
    renderList();
    document.querySelector('.side').scrollTop = 0;
  }
  $('cancel-btn').addEventListener('click', function () { clearForm(); renderList(); });

  $('save-btn').addEventListener('click', function () {
    if (!draftLatLng || busy) return;
    var name = fName.value.trim();
    if (!name) { alert('이름을 적어 주세요.'); fName.focus(); return; }
    var old = editingId ? spots.filter(function (s) { return s.id === editingId; })[0] : null;
    var pin = {
      id: editingId || ('field-' + Date.now()),
      cat: fCat.value, name: name,
      lat: round5(draftLatLng.lat), lng: round5(draftLatLng.lng),
      // OSM에서 온 핀을 고치면 직접 확인한 것으로 바꾼다
      source: 'field', verifiedAt: todayText()
    };
    if (old && old.source === 'osm' && old.lat === pin.lat && old.lng === pin.lng && old.name === name && !confirm('직접 가서 확인한 내용인가요?\n확인을 누르면 "직접 확인 · ' + todayText() + '"으로 표시됩니다.')) {
      pin.source = 'osm'; delete pin.verifiedAt;
    }
    var tags = fTags.value.split(',').map(function (t) { return t.trim(); }).filter(Boolean);
    if (tags.length) pin.tags = tags;
    if (fNote.value.trim()) pin.note = fNote.value.trim();
    if (fPhone.value.trim()) pin.phone = fPhone.value.trim();
    if (pin.cat === 'spot') {
      if (pPhoto) pin.photo = pPhoto;
      if (gName.value.trim()) {
        pin.guardian = { name: gName.value.trim() };
        if (gSignal.value) pin.guardian.signal = gSignal.value;
        if (gLine.value.trim()) pin.guardian.line = gLine.value.trim();
        if (gPhoto) pin.guardian.photo = gPhoto;
      }
    }
    var keepId = pin.id;
    spots = spots.filter(function (s) { return s.id !== pin.id; }).concat([pin]);
    save().then(function () {
      // 저장한 뒤에도 같은 스팟을 계속 고칠 수 있게 연다(수호지킴이 카드 보기가 바로 되도록)
      var saved = spots.filter(function (s) { return s.id === keepId; })[0];
      if (saved) startEdit(saved); else clearForm();
    }).catch(function () {});
  });

  function renderMarkers() {
    Object.keys(markers).forEach(function (id) { map.removeLayer(markers[id]); });
    markers = {};
    spots.forEach(function (pin) {
      if (!InfraPins.category(pin.cat)) return;
      var size = pin.cat === 'spot' ? 36 : 24;
      var html = InfraPins.markerHtml(pin.cat, size);
      var photo = InfraPins.mainPhoto(pin);
      if (photo) html = '<div style="width:' + size + 'px;height:' + size + 'px;border-radius:50%;overflow:hidden;border:3px solid #b8563a;box-sizing:border-box;"><img src="' + src(photo) + '" style="width:100%;height:100%;object-fit:cover"></div>';
      markers[pin.id] = L.marker([pin.lat, pin.lng], {
        icon: L.divIcon({ className: '', html: html, iconSize: [size, size], iconAnchor: [size / 2, size / 2] }),
        zIndexOffset: pin.cat === 'spot' ? 500 : 0
      }).bindTooltip(pin.name || '').on('click', function () { startEdit(pin); }).addTo(map);
    });
  }
  function renderList() {
    var only = $('list-filter').value, listEl = $('pin-list');
    listEl.innerHTML = '';
    $('pin-count').textContent = spots.length;
    // 동반 스팟을 맨 위에
    spots.slice().sort(function (a, b) { return (b.cat === 'spot') - (a.cat === 'spot'); })
      .filter(function (p) { return !only || p.cat === only; })
      .forEach(function (pin) {
        var cat = InfraPins.category(pin.cat);
        if (!cat) return;
        var li = document.createElement('li');
        if (pin.id === editingId) li.className = 'is-editing';
        var photo = InfraPins.mainPhoto(pin);
        if (photo) { var face = document.createElement('img'); face.className = 'face'; face.src = src(photo); face.alt = ''; li.appendChild(face); }
        var info = document.createElement('div');
        info.className = 'info';
        var name = document.createElement('div');
        name.className = 'name';
        name.textContent = pin.name || cat.label;
        var meta = document.createElement('div');
        meta.className = 'meta';
        meta.textContent = cat.label + ' · ' + InfraPins.sourceText(pin) + (InfraPins.hasGuardian(pin) ? ' · 수호지킴이 ' + pin.guardian.name : '');
        info.appendChild(name); info.appendChild(meta);
        info.addEventListener('click', function () { map.setView([pin.lat, pin.lng], 17); });
        var edit = document.createElement('button');
        edit.type = 'button'; edit.textContent = '고치기';
        edit.addEventListener('click', function () { startEdit(pin); });
        var del = document.createElement('button');
        del.type = 'button'; del.className = 'danger'; del.textContent = '삭제';
        del.addEventListener('click', function () {
          if (busy || !confirm('"' + (pin.name || cat.label) + '"을(를) 지울까요?\n"모두에게 반영"을 누르기 전까지는 서비스에서 안 지워져요.')) return;
          spots = spots.filter(function (s) { return s.id !== pin.id; });
          if (editingId === pin.id) clearForm();
          save().catch(function () {});
        });
        li.appendChild(info); li.appendChild(edit); li.appendChild(del);
        listEl.appendChild(li);
      });
  }
  function renderAll() { if (map) { renderMarkers(); renderList(); } }

  // ── 시작 ──
  function showSetup(reason) {
    block(
      '<h2 style="margin:0 0 10px;font-size:18px;">스팟 편집 — 운영자 전용</h2>' +
      (reason ? '<p style="color:var(--danger);font-weight:700;">' + reason + '</p>' : '') +
      '<p>이 페이지는 운영자 컴퓨터에서만 씁니다. 편집한 내용을 저장소에 바로 커밋하려면 GitHub 토큰이 필요해요.</p>' +
      '<ol style="padding-left:18px;margin:0 0 12px;">' +
        '<li>GitHub → Settings → Developer settings → Personal access tokens → <b>Fine-grained tokens</b> → Generate new token</li>' +
        '<li>Repository access: <b>Only select repositories</b> → <code>' + SpotGitHub.OWNER + '/' + SpotGitHub.REPO + '</code></li>' +
        '<li>Permissions → Repository permissions → <b>Contents: Read and write</b> (다른 권한은 주지 않기)</li>' +
        '<li>만든 토큰을 아래에 붙여 넣기</li>' +
      '</ol>' +
      '<p style="font-size:12px;color:var(--ink-soft);">토큰은 이 브라우저에만 저장되고 GitHub(api.github.com) 말고는 어디로도 보내지 않아요. ' +
      '토큰을 넣은 브라우저에서만 동네 지도에 "스팟 편집" 버튼이 보여요.</p>' +
      '<div style="display:flex;gap:8px;margin-top:10px;">' +
        '<input id="token-input" type="password" autocomplete="off" placeholder="github_pat_..." style="flex:1;font-family:inherit;font-size:14px;padding:9px;border:1px solid var(--panel-border);border-radius:8px;">' +
        '<button type="button" class="publish" id="token-save">저장</button>' +
      '</div>'
    );
    $('token-save').addEventListener('click', function () {
      var t = $('token-input').value.trim();
      if (!t) return;
      SpotGitHub.setToken(t);
      $('token-save').disabled = true;
      SpotGitHub.check().then(function () { location.reload(); })
        .catch(function (e) { SpotGitHub.setToken(''); showSetup('토큰을 확인하지 못했어요: ' + e.message); });
    });
  }

  if (!window.SpotGitHub || !window.InfraPins) { block('필요한 파일을 불러오지 못했어요. 새로고침해 주세요.'); return; }
  if (!SpotGitHub.hasToken()) { showSetup(); return; }

  $('status-msg').textContent = '저장소에서 불러오는 중…';
  SpotGitHub.load().then(function (st) {
    baseSha = st.headSha;
    baseSpots = st.spots;
    spots = JSON.parse(JSON.stringify(st.spots));
    // 반영 안 한 편집이 이 컴퓨터에 남아 있으면 이어서
    var draft = null;
    try { draft = JSON.parse(localStorage.getItem(DRAFT_KEY)); } catch (e) { draft = null; }
    if (draft && Array.isArray(draft.spots)) {
      spots = draft.spots;
      if (draft.baseSha) baseSha = draft.baseSha;
    }

    $('layout').hidden = false;
    map = L.map('map').setView(DEFAULT_CENTER, 15);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(map);
    map.on('click', function (e) { setDraft(e.latlng); });
    var allOpt = document.createElement('option');
    allOpt.value = ''; allOpt.textContent = '전체 보기';
    $('list-filter').appendChild(allOpt);
    InfraPins.CATEGORIES.slice().sort(function (a, b) { return (b.key === 'spot') - (a.key === 'spot'); }).forEach(function (cat) {
      [fCat, $('list-filter')].forEach(function (sel) {
        var opt = document.createElement('option');
        opt.value = cat.key; opt.textContent = cat.label;
        sel.appendChild(opt);
      });
    });
    $('list-filter').addEventListener('change', renderList);
    clearForm();
    renderAll();
    renderStatus();
    setTimeout(function () { map.invalidateSize(); }, 50);
  }).catch(function (e) {
    if (e.status === 401) { SpotGitHub.setToken(''); showSetup('토큰이 맞지 않거나 만료됐어요. 새로 넣어 주세요.'); return; }
    block('<strong>저장소에서 불러오지 못했어요.</strong><br>' + e.message + '<br><button type="button" onclick="location.reload()">다시 시도</button>');
  });
})();
</script>
</body>
</html>
